name: Extinct Glacier
description: Submit one or more glaciers to be marked as extinct in the GLIMS database.
title: "[Extinct glacier submission] "
labels:
  - "extinct glacier"
projects: ["glims-nsidc/projects/1"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request that one or more glaciers be marked as extinct (`glacier_status = 'gone'`) in `glacier_static`. Provide one GLIMS glacier ID per line in the field below, along with the disappearance metadata that applies to all listed glaciers.
        
        For the issue title, please include your name as the submitter, the name of the country or region of the extinct glaciers.

        If different glaciers have different disappearance dates or sources, please open a separate issue for each group.

        For a description of the submission process and the information required, please see [Submitting Extinct Glaciers to GLIMS](https://glims-submissions-docs.readthedocs.io/en/latest/submitting_extinct_glaciers.html)
 
  - type: textarea
    id: glacier_ids
    attributes:
      label: Glacier IDs
      description: The unique identifier assigned to the glacier in the GLIMS database (e.g., G006813E46133N). One GLIMS glacier ID per line, or attach a file (.txt, .csv, or .xlsx). For text and CSV files, one ID per line or per cell in the first column. For Excel files, IDs in the first column of the first sheet.

    validations:
      required: true

  - type: input
    id: est_disappear_date
    attributes:
      label: Estimated disappearance date (`est_disappear_date`)
      description: best estimate of when the glacier disappeared, in ISO 8601 format (YYYY-MM-DD). The date of disappearance should be the date that the glacier was observed to be gone in the field, or the date of the image that was used to determine it was gone.
    validations:
      required: true

  - type: input
    id: est_disappear_unc
    attributes:
      label: Disappearance date uncertainty in days (`est_disappear_unc`)
      description: he uncertainty in the disappearance date, expressed as an integer number of days. This uncertainty can be estimated as the number of days between the last date the glacier was observed and the Estimated disappearance date. Where the date last observed can be an observation in the field or the existence of the glacier in a previous inventory.
    validations:
      required: true

  - type: input
    id: gone_source
    attributes:
      label: Source (`gone_source`)
      description: Attribution for the disappearance determination. This should include the name of the person who made the determination, their institution, and/or a relevant publication DOI or image ID. For example: Jane Doe (University of X), Landsat 8 image LC08_L1TP_XYZ_20200901 or Doe et al. 2023, https://doi.org/10.xxxx/xxxxx.
    validations: 
      required: true
  
  - type: dropdown
    id: method
    attributes:
      label: Method (`method`)
      description: Method for determining the glacier(s) are extinct.
      options:
        - Differencing of inventories
        - In situ visit
        - Imagery comparisons
        - Other (explain in notes)
    validations:
      required: true


  - type: input
    id: glims_added_extinct_date
    attributes:
      label: Date added to GLIMS as extinct (`glims_added_extinct_date`)
      description: The date on which you are submitting this information (YYYY-MM-DD). If left blank, today’s date will be used.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Any context useful for the analyst processing this request.
    validations:
      required: false
