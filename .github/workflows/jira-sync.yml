# .github/workflows/jira-sync.yml
name: Create Jira Ticket from GitHub Issue

on:
  issues:
    types: [opened]

jobs:
  create-jira-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'resubmission') ||
      contains(github.event.issue.labels.*.name, 'new submission') ||
      contains(github.event.issue.labels.*.name, 'extinct glacier')
    steps:
      - name: Get issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: |
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json number,title,url > issue.json
          echo "number=$(jq -r .number issue.json)" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .title issue.json)" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .url issue.json)" >> "$GITHUB_OUTPUT"

      - name: Create Jira Issue
        id: create
        uses: atlassian/gajira-create@v3
        with:
          project: DPT
          issuetype: Story
          summary: "${{ github.event.issue.title }}"
          description: "Synced from GitHub issue: ${{ github.event.issue.html_url }}"
          fields: |
            {
              "labels": ["nsidc0272"],
              "components": [{"name": "data production"}]
            }

      - name: Comment back on GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Jira ticket created: ${{ steps.create.outputs.issue }}`
            })
