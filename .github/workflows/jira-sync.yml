# .github/workflows/jira-sync.yml
name: Create Jira Ticket from GitHub Issue

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to create a Jira ticket for
        required: true

jobs:
  create-jira-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'resubmission') ||
      contains(github.event.issue.labels.*.name, 'new submission') ||
      contains(github.event.issue.labels.*.name, 'extinct glacier')
    steps:
      - name: Get issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: |
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json number,title,url > issue.json
          echo "number=$(jq -r .number issue.json)" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .title issue.json)" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .url issue.json)" >> "$GITHUB_OUTPUT"

      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Create Jira Issue
        id: create
        uses: atlassian/gajira-create@v3
        with:
          project: DPT
          issuetype: Story
          summary: "${{ steps.issue.outputs.title }}"
          description: "Synced from GitHub issue: ${{ steps.issue.outputs.url }}"
          fields: |
            {
              "labels": ["nsidc0272"],
              "components": [{"name": "data production"}]
            }

      - name: Comment back on GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.issue.outputs.number }},
              body: `Jira ticket created: ${{ steps.issue.outputs.number && steps.create.outputs.issue }}`
            })
